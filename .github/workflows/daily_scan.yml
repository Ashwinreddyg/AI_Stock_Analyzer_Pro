name: AI Stock Analyzer Daily Scan
on:
  schedule:
    - cron: '35 14 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas numpy openai anthropic tabulate
      - name: Run daily scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          SCAN_UNIVERSE: '250'
          SCAN_ENRICH: '30'
        run: python scripts/daily_scan.py
      - name: Commit report and history
        run: |
          git config user.name "AI Stock Analyzer Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily_reports data/recommendation_history.csv
          git diff --cached --quiet || git commit -m "Daily AI stock intelligence"
          git push
